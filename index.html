<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Todo Dashboard" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Todo Dashboard</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="window-shell">
      <div class="app-layout">
        <aside class="sidebar" aria-label="작업 목록">
          <div class="brand">
            <span class="brand-mark">✓</span>
            <h1>할 일</h1>
          </div>

          <button class="create-button" id="create-task-button" type="button">
            <span>+</span>
            할 일 추가
          </button>

          <nav class="view-nav" aria-label="보기">
            <button class="active" id="all-view-button" type="button">
              <span>✓</span>
              모든 할 일
            </button>
            <button id="starred-view-button" type="button">
              <span>★</span>
              중요 표시됨
            </button>
            <button id="about-view-button" type="button">
              <span>ⓘ</span>
              소개
            </button>
            <button id="developer-view-button" type="button" hidden>
              <span>⚙</span>
              개발자
            </button>
          </nav>

          <section class="list-section">
            <div class="section-label">목록</div>
            <form class="list-form" id="list-form">
              <input id="list-name" type="text" placeholder="새 목록" autocomplete="off" />
              <button type="submit" aria-label="목록 추가">+</button>
            </form>
            <nav class="list-nav" id="list-nav"></nav>
          </section>

          <div class="sidebar-account">
            <button class="google-button" id="login-button" type="button">Google 로그인</button>
            <div class="profile-wrap" id="profile-wrap" hidden>
              <button class="profile-button" id="profile-button" type="button" aria-label="계정 옵션 열기" aria-expanded="false">
                <img id="user-avatar" alt="" hidden />
                <span id="user-initial">?</span>
              </button>
              <div class="profile-menu" id="profile-menu" hidden>
                <div class="profile-menu-account">
                  <strong id="profile-name">Google 사용자</strong>
                  <span id="profile-email">이메일 정보 없음</span>
                </div>
                <div class="profile-sync" id="profile-sync">
                  <span class="sync-dot" aria-hidden="true"></span>
                  <span id="auth-message">로컬 캐시 사용 중</span>
                </div>
                <button class="profile-menu-nav" id="profile-about-button" type="button">소개</button>
                <button class="profile-menu-nav" id="profile-developer-button" type="button" hidden>개발자</button>
                <button class="profile-logout-button" id="logout-button" type="button">로그아웃</button>
              </div>
            </div>
            <p class="welcome-message" id="welcome-message" hidden></p>
          </div>
        </aside>

        <main class="board-area">
          <div class="board-header">
            <div>
              <p id="board-eyebrow">모든 할 일</p>
              <h2 id="board-title">작업 보드</h2>
            </div>
            <div class="board-status">
              <p id="board-summary">로그인 후 할 일 목록을 불러옵니다.</p>
              <div class="character-status" id="character-status" aria-live="polite">
                <div class="character-status-copy">
                  <strong id="character-mood">대기 중</strong>
                  <span id="character-copy">할 일 상태를 확인합니다.</span>
                  <span class="ai-coach-copy" id="ai-motivation-text">할 일 흐름에 맞춰 가볍게 제안해드릴게요.</span>
                </div>
                <img id="progress-character" class="progress-character" src="character-proud.png" alt="뿌듯한 캐릭터" />
              </div>
            </div>
          </div>

          <section class="columns" id="columns" aria-label="할 일 보드"></section>
        </main>
      </div>
      <div class="undo-toast" id="undo-toast" role="status" aria-live="polite" hidden>
        <span id="undo-message">목록을 삭제했습니다.</span>
        <button id="undo-button" type="button">실행취소</button>
      </div>
      <button class="mobile-create-button" id="mobile-create-task-button" type="button" aria-label="할 일 추가">
        <span>+</span>
      </button>
      <form class="mobile-quick-task" id="mobile-quick-task" hidden>
        <input id="mobile-quick-task-title" type="text" placeholder="새 할 일" autocomplete="off" />
        <div class="mobile-quick-task-actions">
          <button id="mobile-quick-task-details" type="button" aria-label="세부정보 추가">☰</button>
          <label aria-label="날짜 설정">
            <span>◴</span>
            <input id="mobile-quick-task-due" type="datetime-local" />
          </label>
          <button id="mobile-quick-task-star" type="button" aria-label="별표 표시">☆</button>
        </div>
      </form>
      <div class="feedback-modal-backdrop" id="feedback-modal" hidden>
        <form class="feedback-modal" id="feedback-modal-form" aria-labelledby="feedback-modal-title">
          <button class="feedback-modal-close" id="feedback-modal-close" type="button" aria-label="닫기">×</button>
          <h2 id="feedback-modal-title">문제 제보하기</h2>
          <p>Google 로그인 후 사용 중 불편했던 점이나 오류 상황을 알려주세요.</p>
          <label>
            제목
            <input id="feedback-title" type="text" placeholder="예: 로그인 후 목록이 보이지 않음" autocomplete="off" />
          </label>
          <label>
            상세 내용
            <textarea id="feedback-content" placeholder="어떤 화면에서 어떤 문제가 있었는지 적어주세요."></textarea>
          </label>
          <button class="feedback-submit-button" id="feedback-submit-button" type="submit" disabled>제보 제출</button>
        </form>
      </div>
      <div class="task-modal-backdrop" id="task-modal" hidden>
        <form class="task-modal" id="task-modal-form" aria-labelledby="task-modal-title">
          <button class="task-modal-close" id="task-modal-close" type="button" aria-label="닫기">×</button>
          <input class="task-modal-title" id="task-modal-title" type="text" placeholder="제목 추가" autocomplete="off" />

          <div class="task-modal-row">
            <span class="task-modal-icon" aria-hidden="true">◷</span>
            <div class="task-date-fields">
              <input id="task-modal-date" type="date" />
              <select id="task-modal-time" aria-label="시간 선택"></select>
            </div>
          </div>

          <label class="task-modal-check">
            <input id="task-modal-all-day" type="checkbox" />
            <span>종일</span>
          </label>

          <div class="task-modal-row">
            <span class="task-modal-icon" aria-hidden="true">↻</span>
            <select id="task-modal-repeat">
              <option value="none">반복 안함</option>
              <option value="daily">매일</option>
              <option value="weekly">매주</option>
              <option value="monthly">매월</option>
            </select>
          </div>

          <div class="task-modal-row task-modal-description-row">
            <span class="task-modal-icon" aria-hidden="true">☰</span>
            <textarea id="task-modal-description" placeholder="설명 추가"></textarea>
          </div>

          <div class="task-modal-row">
            <span class="task-modal-icon" aria-hidden="true">▦</span>
            <select id="task-modal-list"></select>
          </div>

          <button class="task-modal-save" id="task-modal-save" type="submit" disabled>저장</button>
        </form>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
